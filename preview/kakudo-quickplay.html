<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マナビクエスト｜角度を当てよう！</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8e8;color:#48362a;font-family:system-ui,sans-serif}main{margin:auto;max-width:1100px;height:100dvh;padding:10px;display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(20px,3vw,30px);margin:0;color:#84502f}.scores{font-weight:bold;display:flex;gap:9px}.scores span{border:2px solid #ead4ad;background:white;border-radius:20px;padding:5px 11px}section{background:#fff;border:3px solid #e6cda6;border-radius:20px;padding:12px;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}h2{margin:0;text-align:center;font-size:clamp(18px,2.5vw,27px)}#diagram{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}#diagram svg{max-width:360px;max-height:100%;width:100%}#choices{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;min-height:70px}#choices.picture{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,minmax(0,1fr));flex:1;min-height:0}button{border:3px solid #d7b782;border-radius:14px;background:#ffefd2;color:#473322;font-size:clamp(20px,3vw,35px);font-weight:900;cursor:pointer;min-height:65px}#choices.picture button{min-height:0;background:#fffcf6;display:grid;place-items:center}#choices.picture button svg{height:100%;width:100%;max-height:180px}#result{font-size:24px;font-weight:900;min-height:32px;text-align:center}#next{font-size:17px;padding:6px 17px;min-height:40px;background:#36a1d2;color:white;border:0}footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#806b60}.hide{display:none!important}@media(max-height:530px){section{padding:5px;gap:3px}#choices{min-height:52px}button{min-height:52px}#result{font-size:18px;min-height:20px}}@media(max-width:650px){header{flex-wrap:wrap}.scores{gap:4px;font-size:12px}.scores span{padding:3px 7px}main{padding:5px}section{padding:6px}#choices{gap:5px}}</style></head><body><main><header><h1>⭐ 角度を当てよう！</h1><div class="scores"><span>れんぞく <b id="streak">0</b></span><span>最高 <b id="best">0</b></span><span>第 <b id="number">1</b> 問</span></div></header><section><h2 id="prompt"></h2><div id="diagram"></div><div id="choices"></div><div id="result" aria-live="polite"></div><footer><span>緊急お試し版｜ランキング・データ送信なし</span><button id="next" class="hide">つぎへ ▶</button></footer></section></main><script>"use strict";const A=[30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360],G=[A.filter(x=>x<90),A.filter(x=>x>=90&&x<180),A.filter(x=>x>=180&&x<270),A.filter(x=>x>=270)],el=s=>document.getElementById(s),pick=x=>x[Math.floor(Math.random()*x.length)];let count=0,streak=0,best=0,locked=false,answer=0;function angleSvg(a,rot=0){const x=110,y=90,ray=67,R=40,xy=(deg,r)=>[x+r*Math.cos((deg-rot)*Math.PI/180),y-r*Math.sin((deg-rot)*Math.PI/180)],p0=xy(0,ray),p1=xy(a===360?0:a,ray);let arc='';if(a===360){arc='<circle cx="110" cy="90" r="40" fill="none" stroke="#f49b37" stroke-width="7"/>'}else{let pts=[];for(let i=0,k=Math.ceil(a/5);i<=k;i++){pts.push(xy(a*i/k,R).join(','))}arc='<polyline fill="none" stroke="#f49b37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="'+pts.join(' ')+'"/>'}return '<svg viewBox="0 0 220 180" role="img" aria-label="角度の図"><path d="M '+x+' '+y+' L '+p0.join(' ')+' M '+x+' '+y+' L '+p1.join(' ')+'" fill="none" stroke="#268ad1" stroke-linecap="round" stroke-width="6"/>'+arc+'<circle cx="110" cy="90" r="4" fill="#268ad1"/></svg>'}function next(){count++;locked=false;el('number').textContent=count;el('result').textContent='';el('next').classList.add('hide');answer=pick(A);const type=count%2===1?'number':'picture',idx=answer<90?0:answer<180?1:answer<270?2:3,options=G.map((g,i)=>i===idx?answer:pick(g)).sort(()=>Math.random()-.5);el('prompt').textContent=type==='number'?'オレンジ色の角は何度？':answer+'° を表す図はどれ？';el('diagram').classList.toggle('hide',type==='picture');el('diagram').innerHTML=type==='number'?angleSvg(answer,pick([0,18,27,40])):'';const choice=el('choices');choice.classList.toggle('picture',type==='picture');choice.innerHTML='';options.forEach((v,i)=>{let b=document.createElement('button');b.innerHTML=type==='number'?v+'°':angleSvg(v,(i*19+8)%42);b.setAttribute('aria-label',type==='picture'?'角度図 '+(i+1):v+'度');b.onclick=()=>{if(locked)return;locked=true;if(v===answer){streak++;best=Math.max(best,streak);el('streak').textContent=streak;el('best').textContent=best;el('result').textContent='⭕ せいかい！';el('result').style.color='#23854d';b.style.background='#baf4cd';setTimeout(()=>{if(locked)next()},500)}else{streak=0;el('streak').textContent=0;el('result').textContent='✕ ざんねん！ 正解は '+answer+'°';el('result').style.color='#c44a40';b.style.background='#ffd0ca';el('next').classList.remove('hide')}};choice.appendChild(b)})}el('next').onclick=next;next();</script></body></html>
