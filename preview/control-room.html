<header><div><h1>マナビクエスト管理室</h1></div><div><span id="account"></span> <button id="changePassword" hidden>パスワード変更</button> <button id="logout" hidden title="共有アカウントの全端末をログアウト">ログアウト</button></div></header>
<main><section id="login"><form id="passwordLogin"><input id="adminPassword" type="password" autocomplete="current-password" aria-label="パスワード" required><button id="passwordSubmit" type="submit">管理室に入る</button><p id="loginError" role="alert"></p></form></section><p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><nav aria-label="管理機能"><button data-tab="players">プレイヤー</button><button data-tab="rankings" disabled title="基盤の動作確認後に接続">ランキング</button><button data-tab="games" disabled title="基盤の動作確認後に接続">ゲーム・キャンペーン</button><button data-tab="analytics" disabled title="基盤の動作確認後に接続">学習分析</button><button data-tab="history">操作履歴</button><button data-tab="notice" disabled title="基盤の動作確認後に接続">お知らせ</button></nav><section id="content"></section></section></main>
<dialog id="confirmDialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogFields"></div><p id="dialogError" role="alert"></p><footer><button id="cancel">キャンセル</button><button id="execute" class="primary">確定する</button></footer></dialog>
<dialog id="passwordDialog"><form id="passwordChangeForm"><h2>パスワード変更</h2><label>現在のパスワード<input id="oldPassword" type="password" autocomplete="current-password" required></label><label>新しいパスワード（12文字以上）<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><label>新しいパスワードの確認<input id="repeatPassword" type="password" autocomplete="new-password" minlength="12" required></label><p>変更を開始すると、ほかの端末も含めて管理セッションを無効化する。</p><p id="passwordChangeError" role="alert"></p><button id="passwordChangeSubmit">変更してログアウト</button><button type="button" id="passwordChangeCancel">キャンセル</button></form></dialog></body></html>
