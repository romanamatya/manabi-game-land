<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>120秒チャレンジ・隔離検証</title><script src="../environment.js?v=a4b8625a2f22"></script><script src="../environment-runtime.js?v=a4b8625a2f22"></script><script src="../challenge120-core.js?v=a4b8625a2f22"></script><style>body{font:20px/1.5 system-ui;max-width:1000px;margin:30px auto;padding:20px}button,a{display:inline-block;margin:6px;padding:12px;font:inherit}li{margin:8px}#status{white-space:pre-wrap}</style></head><body><h1>2分間チャレンジ・隔離検証</h1><p>adminTest専用の端末領域だけを使用します。通常プレイヤー・Firebase・本番記録には書き込みません。検証用の最高称号達成状態を用意できます。</p><button id="prepare">隔離テストで10ゲームを最高称号達成状態にする</button><button id="expiry">隔離テストに終了時刻を過ぎた挑戦を用意する</button><p id="status"></p><ol id="games"></ol><script>
if(window.MANABI_ENV?.preview!==true||!new URL(location.href).searchParams.has('adminTest')){document.body.textContent='adminTest=1 の隔離検証専用です。';throw Error('isolated-test-required');}
const C=window.ManabiChallenge120Core,S=window.manabiStorage,$=id=>document.getElementById(id);
$('prepare').onclick=()=>{for(const [g,n] of Object.entries(C.highest)){if(g==='keisan')S.setItem('mgl_best',String(n));else{let old={};try{old=JSON.parse(S.getItem('mgl_'+g)||'{}')}catch{}S.setItem('mgl_'+g,JSON.stringify({...old,best:Math.max(old.best||0,n)}));}S.setItem('mgl_challenge120_v1:'+g,JSON.stringify(C.fresh(g,true)));}$('status').textContent='10ゲームの隔離データを用意しました。各ゲームで「2分間チャレンジ開始」を押せます。通常領域は未変更。';};
$('expiry').onclick=()=>{for(const g of Object.keys(C.highest)){const s=C.start(C.fresh(g,true),Date.now()-121000,crypto.randomUUID(),'preview-local-120-v1');s.attemptBest=6;s.sequence=6;s.streak=6;S.setItem('mgl_challenge120_v1:'+g,JSON.stringify(s));}$('status').textContent='終了予定時刻を過ぎた隔離データを用意しました。ゲームを開くと結果画面になります。';};
for(const g of Object.keys(C.highest)){const li=document.createElement('li'),a=document.createElement('a');a.setAttribute('href',['..','games',g+'.html?adminTest=1'].join('/'));a.textContent=g;li.append(a);$('games').append(li);}
</script></body></html>
