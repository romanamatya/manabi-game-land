<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<title>分数のきほんをマスター！｜マナビクエスト（確認用）</title>
<link rel="stylesheet" href="../fraction-basics.css">
<script src="../environment.js"></script>
<script type="module" src="../fraction-basics-game.js"></script>
</head>
<body>
<div class="app">
  <header class="header">
    <a href="../math.html" class="back">← 算数へ</a>
    <h1>分数のきほんをマスター！</h1>
    <span class="preview-label">確認用・ポイント未保存</span>
  </header>
  <div class="layout">
    <aside class="panel stats" aria-label="練習記録">
      <h2>練習の記録</h2>
      <div class="stat"><span>連続正解</span><strong id="streak">0</strong></div>
      <div class="stat"><span>自己最高</span><strong id="best">0</strong></div>
      <div class="stat"><span>正解した数</span><strong id="total">0</strong></div>
      <div class="timer" id="clock" role="timer">時間制限なし</div>
      <button class="secondary" id="restart" type="button">練習をやり直す</button>
    </aside>
    <main class="panel game">
      <div class="question-header"><span class="category" id="category">分数</span><span id="question-number">第1問</span></div>
      <h2 id="question">問題を準備しています</h2>
      <div class="diagram" id="diagram" aria-label="問題の図"></div>
      <p class="instruction" id="instruction">答えをタッチしよう。</p>
      <div class="options" id="options" role="group" aria-label="答えの選択肢"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <section class="gate" id="gate" hidden>
        <h2 id="gate-title">120秒チャレンジ</h2>
        <p id="gate-message"></p>
        <button id="challenge-start" type="button">120秒チャレンジを始める</button>
      </section>
    </main>
    <aside class="panel titles">
      <h2>称号タワー</h2>
      <ol id="titles">
        <li data-at="25"><span>分数の王者</span><small>25問連続</small></li>
        <li data-at="15"><span>分数の達人</span><small>15問連続</small></li>
        <li data-at="10"><span>分数マスター</span><small>10問連続</small></li>
        <li data-at="5"><span>分数ハンター</span><small>5問連続</small></li>
        <li data-at="3"><span>分数みならい</span><small>3問連続</small></li>
      </ol>
      <p class="small">称号名は仮設定です。正式イラストは未作成です。</p>
    </aside>
  </div>
</div>
</body>
</html>
