<header class="hero"><small>マナビクエスト</small><h1>🧮 計算のきまり</h1><p>計算する記号をタップして、ポイントを集めよう！</p></header>
<div class="stats"><div class="stat"><small>⭐ ポイント</small><b id="points">0</b></div><div class="stat"><small>🔥 連続正解</small><b id="streak">0</b></div><div class="stat"><small>🏆 最高記録</small><b id="best">0</b></div></div>
<section class="rank" aria-label="連続正解の称号タワー"><div class="tower-title">🚀 称号タワー</div><div id="tower"></div></section>
<section class="work" id="work" aria-label="計算式"></section>
<div id="msg" role="status" aria-live="polite">どの記号から計算する？</div>
<section class="guide"><h2>💡 計算する順番</h2><div class="steps"><div class="step"><b>①</b>（ ）の中</div><div class="step"><b>②</b>×・÷</div><div class="step"><b>③</b>＋・－</div></div><p>同じ順番なら、左から計算。</p></section>
<div class="actions"><button class="action" id="next" hidden>次の問題 ▶</button><button class="action secondary" id="retry" hidden>↻ 間違えた問題に再チャレンジ</button></div>
</main><div class="overlay" id="resultOverlay" role="status" aria-live="polite" hidden></div><script>
const signs=['＋','－','×','÷'],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const titles=[{at:20,name:'計算博士',icon:'👑'},{at:10,name:'計算名人',icon:'🏅'},{at:5,name:'計算の達人',icon:'🥉'},{at:3,name:'計算ルーキー',icon:'⭐'},{at:0,name:'スタート',icon:'🌱'}];
let pointContext=null,pointSteps=[];let current,original,history=[],points=Number(window.manabiStorage.getItem("mgl_points")||0),streak=0,best=Number(window.manabiStorage.getItem("mgl_best")||0),mistake=false,finished=false,retryMode=false,missed=[],awarded=new Set(),questionId=0,activeId=0,advanceTimer=null;
const clone=s=>({n:[...s.n],o:[...s.o],l:s.l,r:s.r});
function calc(a,b,o){return o===0?a+b:o===1?a-b:o===2?a*b:a/b}
function priority(s){const ids=s.o.map((_,i)=>i).filter(i=>s.l<0||(i>=s.l&&i<s.r));return ids.find(i=>s.o[i]>=2)??ids[0]??-1}
function reduce(s,i){const n=[...s.n],o=[...s.o];n.splice(i,2,calc(n[i],n[i+1],o[i]));o.splice(i,1);let l=s.l,r=s.r;if(l>=0){if(i>=l&&i<r){r--;if(l===r){l=-1;r=-1}}else if(i<l){l--;r--}}return {n,o,l,r}}
function valid(s){let x=clone(s);while(x.o.length){const i=priority(x);if(i<0)return false;const v=calc(x.n[i],x.n[i+1],x.o[i]);if(!Number.isInteger(v)||v<0||v>999)return false;x=reduce(x,i)}return true}
function generate(){for(let k=0;k<20000;k++){const n=Array.from({length:4},()=>rand(1,12)),o=Array.from({length:3},()=>rand(0,3)),size=Math.random()<.75?rand(2,3):0,l=size?rand(0,4-size):-1,s={n,o,l,r:size?l+size-1:-1};if(o.some(x=>x<2)&&o.some(x=>x>=2)&&valid(s))return s}return {n:[8,6,2,3],o:[0,3,2],l:1,r:3}}
function parts(s){const out=[];s.n.forEach((n,i)=>{if(i===s.l)out.push(['paren','（']);out.push(['num',String(n)]);if(i===s.r)out.push(['paren','）']);if(i<s.o.length)out.push(['op',signs[s.o[i]],i])});return out}
function row(s,index,interactive){const line=document.createElement('div');line.className='line'+(interactive?'':' previous');const eq=document.createElement('span');eq.className='eq';eq.textContent=index?'＝':'';line.append(eq);const exp=document.createElement('div');exp.className='expression';for(const [kind,val,i] of parts(s)){const el=document.createElement(kind==='op'&&interactive?'button':'span');el.className=kind;el.textContent=val;if(kind==='op'&&interactive){el.type='button';el.setAttribute('aria-label',val+' を計算');el.onclick=()=>choose(i)}exp.append(el)}line.append(exp);return line}
let overlayTimer;function flash(ok){const el=document.getElementById('resultOverlay');clearTimeout(overlayTimer);el.textContent=ok?'⭕ 正解！':'❌ 不正解';el.className='overlay '+(ok?'good':'bad');el.hidden=false;overlayTimer=setTimeout(()=>el.hidden=true,1200)}function message(t,kind=''){const m=document.getElementById('msg');m.className=kind;m.textContent=t}
function render(){const w=document.getElementById('work');w.replaceChildren();const rows=document.createElement('div');rows.className='equation-rows';history.forEach((s,i)=>rows.append(row(s,i,false)));rows.append(row(current,history.length,!finished));w.append(rows);document.getElementById('points').textContent=window.ManabiEconomy.balance('keisan');document.getElementById('streak').textContent=streak;document.getElementById('best').textContent=best;const tower=document.getElementById('tower');tower.replaceChildren();for(const t of titles){const step=document.createElement('div');step.dataset.need=t.at;step.className='tower-step'+(streak>=t.at?' passed':'')+(streak>=t.at&&!titles.some(x=>x.at>t.at&&x.at<=streak)?' current':'');const name=document.createElement('strong');name.textContent=(t.at?'':t.icon+' ')+t.name;const count=document.createElement('small');count.textContent=t.at?t.at+'問連続':'スタート';step.append(name,count);tower.append(step)}document.getElementById('next').hidden=!finished||!mistake;document.getElementById('retry').hidden=!finished||!missed.length;document.getElementById('retry').textContent='↻ 間違えた問題に再チャレンジ（'+missed.length+'問）'}
function hint(s){return s.l>=0?'まずは（ ）の中から考えよう！':s.o.some(x=>x>=2)?'× と ÷ を先に計算しよう！':'＋ と － は左から順番に計算しよう！'}
function choose(i){if(finished)return;pointSteps.push(i);if(i!==priority(current)){flash(false);mistake=true;streak=0;message('計算の順番を確認。'+hint(current),'wrong');render();return}history.push(clone(current));current=reduce(current,i);if(!current.o.length){flash(true);finished=true;const win=!mistake&&!awarded.has(activeId);window.ManabiEconomy.answer(pointContext,pointSteps);if(win){streak++;best=Math.max(best,streak);awarded.add(activeId);window.manabiStorage.setItem('mgl_best',String(best));if(window.mglSaveScore)window.mglSaveScore(points,best)}if(mistake){if(!missed.some(x=>x.id===activeId))missed.push({id:activeId,s:clone(original)});message('計算終了。次の問題へ。','wrong')}else{missed=missed.filter(x=>x.id!==activeId);message(win?'🎉 正解！':'計算終了。','win')}}else message('次の計算へ。','correct');render();if(finished&&!mistake){clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>{if(finished&&activeId===completedId)newGame()},1500);const completedId=activeId}}
function start(s,id,retry){clearTimeout(advanceTimer);pointSteps=[];pointContext=window.ManabiEconomy.begin('keisan',s);current=clone(s);original=clone(s);activeId=id;history=[];mistake=false;finished=false;retryMode=retry;message(retry?'間違えた問題をもう一度。':'どの記号から計算する？');render()}
function newGame(){const s=generate();start(s,++questionId,false)}
document.getElementById('next').onclick=newGame;
document.getElementById('retry').onclick=()=>{if(!finished||!missed.length)return;const entry=missed[0];start(entry.s,entry.id,true)};
newGame();window.addEventListener('manabi-remote-best',e=>{best=Math.max(best,e.detail);render()});
</script><script type="module" src="../social-score-sync.js"></script></body></html>
