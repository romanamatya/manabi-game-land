  <style>

<body><main>
  <h1>ポイント・記録の確認</h1>
  <p>ゲームで使っている端末とブラウザーで開いてください。保存済みの記録を読み取って確認します。結果はこの画面に表示されます。</p>
  <p>名前・UID・回答内容は診断結果に含めません。記録の変更や送信は行いません。</p>
  <table aria-label="診断結果"><tbody id="results"><tr><th>確認状況</th><td>確認しています…</td></tr></tbody></table>
  <p><button type="button" id="copy">診断結果をコピー</button> <a href="../index.html">ホームへ戻る</a> <a href="point-repair.html">ポイント保存の復旧</a></p>
