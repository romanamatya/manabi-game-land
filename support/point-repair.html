<body><main><h1>ポイント保存の復旧</h1>
<p>不具合が起きている端末の、いつものブラウザーで開いてください。復旧中は、ほかのゲーム画面を操作せずにお待ちください。</p>
<p>はじめに、この端末内へ元データのバックアップを保存します。現在の残高や所持品と一致する書き込みデータだけを整理し、加算済みの回答が再びポイントにならないよう保護します。保存待ちの回答とゲームの記録は保持します。</p>
<p>端末外へのデータ送信は行いません。照合できない場合は、確認コードを表示して停止します。</p>
<button type="button" id="repair">バックアップして復旧する</button>
<p id="status" role="status" aria-live="polite"></p>
