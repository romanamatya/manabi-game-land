:25px;font-weight:800;color:#315d8c;margin-bottom:0}.leaderboard .board-link{margin:4px 6px 0 0}.game-leader p{line-height:1.5}@media(max-width:600px){.game-leaders{grid-template-columns:1fr}}</style><style>.home-top{display:grid;grid-template-columns:minmax(200px,280px) minmax(0,560px);align-items:start;justify-content:center;gap:20px;padding:16px 20px}.home-top .player-panel{width:100%;margin:0;padding:14px}.home-top .mqlink{position:relative!important;inset:auto!important;width:100%!important;height:auto!important;aspect-ratio:3/1;margin:0!important}.home-top summary{cursor:pointer;overflow-wrap:anywhere}.account-hint{display:block;font-size:13px;margin:6px 0 0 22px;color:#526e85}.home-top h2{font-size:17px}.account-note{font-size:12px;color:#526e85}#myRecords{padding:0;list-style:none}#myRecords li{padding:9px 0;border-top:1px solid #d9e6f2;font-size:14px}#myRecords a{display:block;margin-top:4px;color:#315d8c}.home-top input{width:100%}.home-top form button{margin-top:8px}.home-top .notice{font-size:12px}@media(max-width:620px){.home-top{grid-template-columns:1fr;gap:12px}.home-top .mqlink{grid-row:1;width:min(420px,100%)!important;justify-self:center}.home-top .player-panel{max-width:none}} </style><style>.home-top{display:block;position:relative;max-width:1200px;margin:auto;padding:16px 80px;min-height:150px}.home-top .mqlink{width:min(560px,100%)!important;margin:0 auto!important}.home-top .player-panel{position:absolute;left:18px;top:18px;width:auto;padding:0;border:0;background:transparent;z-index:1100}.home-top summary{list-style:none;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border:1px solid #c8d9e9;border-radius:50%;background:white;box-shadow:0 2px 6px #142c4410}.home-top summary::-webkit-details-marker{display:none}.account-icon{font-size:26px}.home-top #accountMenu[open]{width:min(290px,calc(100vw - 36px));padding:12px;background:white;border:1px solid #d6e8f5;border-radius:16px;box-shadow:0 6px 20px #142c4420}.home-top #playerName{display:block;overflow-wrap:anywhere;margin-top:12px}.home-top #accountMenu:not([open])>#playerName{display:none}.home-top summary:focus-visible{outline:3px solid #426bd9;outline-offset:3px}#nicknameDialog{width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 40px);overflow:auto;border:0;border-radius:22px;padding:28px;background:white;color:#253b50;box-shadow:0 16px 70px #142c4440}#nicknameDialog::backdrop{background:#253b5080;backdrop-filter:blur(5px)}#nicknameDialog h1{font-size:25px;margin:0 0 14px}#nicknameDialog input{width:100%;padding:12px;font:inherit;border:2px solid #b7cde0;border-radius:10px;margin-top:8px}#nicknameDialog button{width:100%;padding:13px;font:inherit;border:0;border-radius:10px;background:#416bdc;color:white;margin-top:14px;cursor:pointer}#nicknameDialog .notice{font-size:13px;line-height:1.7;color:#9c4934;background:#fff0e9;padding:12px;border-radius:9px}@media(max-width:620px){.home-top{padding:76px 16px 12px}.home-top .mqlink{width:min(420px,100%)!important}.home-top .player-panel{top:14px;left:16px}}
</style><body class="mq-home"><dialog id="nicknameDialog" aria-labelledby="registrationTitle"><div id="playerWelcome"><h1 id="registrationTitle">ニックネームを決めよう</h1><p>登録して、マナビクエストをはじめよう。</p><form id="playerForm"><label for="nickname">ニックネーム</label><br><input id="nickname" maxlength="12" autocomplete="off" placeholder="例：みかん、ペンギン" required><fieldset id="registrationAvatars"><legend>アイコンを選ぶ</legend><div id="registrationAvatarChoices"></div></fieldset><button type="submit">この名前ではじめる</button></form><p class="notice">⚠️ 本当の名前は使わない。 自分や友達の本名、学校名など、だれなのか分かる名前は入力しない。</p></div></dialog><div class="home-top"><section class="player-panel" id="playerPanel"><div id="playerReady" hidden><details id="accountMenu"><summary aria-label="自分のアカウント"><span id="accountAvatar"></span></summary><div class="account-head"><span id="accountAvatarLarge"></span><strong id="playerName"></strong></div><button type="button" class="mq-customize" data-profile-panel="avatar">アイコン・枠を選ぶ</button><nav class="mq-menu" aria-label="アカウントメニュー"><button type="button" data-profile-panel="records">自分の記録</button><button type="button" data-profile-panel="titles">称号コレクション</button><button type="button" data-profile-panel="points">ポイント</button><button type="button" data-profile-panel="ranking">ランキング</button><button type="button" data-profile-panel="settings">設定</button></nav><div class="status" id="syncStatus">接続を確認中…</div></details></div></section><a class="mqlink" href="index.html" aria-label="トップへ戻る"><img src="assets/title.png" alt="マナビクエスト"></a></div><main><h1>どの教科で遊ぶ？</h1><div class="grid subject-grid"><a class="card subject-card" href="japanese.html"><img src="assets/subjects/japanese-v1.png" alt="" width="1280" height="1280" decoding="async"><strong>国語</strong><span class="subject-status">準備中</span></a><a class="card subject-card" href="math.html"><img src="assets/subjects/math-v1.png" alt="" width="1280" height="1280" decoding="async"><strong>算数</strong><span class="subject-status">ゲームを選ぶ</span></a><a class="card subject-card" href="social.html"><img src="assets/subjects/social-v1.png" alt="" width="1280" height="1280" decoding="async"><strong>社会</strong><span class="subject-status">ゲームを選ぶ</span></a><a class="card subject-card" href="science.html"><img src="assets/subjects/science-v1.png" alt="" width="1280" height="1280" decoding="async"><strong>理科</strong><span class="subject-status">準備中</span></a><a class="card subject-card" href="language.html"><img src="assets/subjects/english-v2.png" alt="" width="1280" height="1280" decoding="async"><strong>英語</strong><span class="subject-status">ゲームを選ぶ</span></a></div><section class="leaderboard" id="leaderboard"><h2>今のチャンピオン</h2><p>最高連続正解の記録</p><div id="boardList" class="game-leaders" aria-live="polite"><p>読み込み中…</p></div><p id="boardStatus" style="font-size:13px;color:#526980">記録はオンラインで共有されます。ランキングはページを開いたときに更新されます。</p><button type="button" id="refreshBoard" class="board-link">ランキングを更新 ↻</button><button id="previewRecords" type="button" class="board-link" hidden>確認用の記録を表示</button></section></main><script type="module">if(window.MANABI_ENV?.preview){
const storage=window.manabiStorage;
const $=id=>document.getElementById(id);
function showLocal(){const nickname=storage.getItem('mgl_nickname')||'';$('playerWelcome').hidden=!!nickname;$('playerReady').hidden=!nickname;$('playerName').textContent=nickname;$('syncStatus').textContent='確認用の名前をこの端末に保存';}
let displayExamples=true;
function showRecords(){const records=displayExamples?window.ManabiLeaderboard.examples:window.ManabiLeaderboard.localPlayers();window.ManabiLeaderboard.render(records);$('boardStatus').textContent=displayExamples?'表示例：試作用の名前と記録。本番の実際の順位ではない。':'確認用の端末内記録。本番のランキングには送信しない。';$('previewRecords').hidden=false;$('previewRecords').textContent=displayExamples?'確認用の記録を表示':'表示例を見る';}
$('previewRecords').onclick=()=>{displayExamples=!displayExamples;showRecords()};
$('playerForm').onsubmit=e=>{e.preventDefault();const value=$('nickname').value.trim();if(!value||value.length>12||/[<>\n\r]/.test(value))return;storage.setItem('mgl_nickname',value);showLocal();};
$('refreshBoard').onclick=showRecords;showLocal();showRecords();
}else{
const {initializeApp}=await import("https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js");
const {getAuth,signInAnonymously,onAuthStateChanged}=await import("https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js");
const {getFirestore,doc,getDoc,setDoc,collection,query,orderBy,limit,getDocs}=await import("https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js");
const firebaseConfig={apiKey:"AIzaSyAhm6WMqV7yGmNRRDCeZcOk5HH-dlga9no",authDomain:"manabi-game-land.firebaseapp.com",projectId:"manabi-game-land",storageBucket:"manabi-game-land.firebasestorage.app",messagingSenderId:"723974836914",appId:"1:723974836914:web:4e57af8336083f82a72fab"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let uid=null,nick="",online=false;
const validName=s=>s.length>=1&&s.length<=12&&!/[<>\n\r]/.test(s);
function showPlayer(){ $("playerWelcome").hidden=!!nick;$("playerReady").hidden=!nick;$("playerName").textContent=nick;}
function status(s){$("syncStatus").textContent=s;}
async function saveProfile(){if(!uid||!nick)return;await setDoc(doc(db,"players",uid),{nickname:nick,appearance:window.ManabiProfile.appearance(window.manabiStorage),updatedAt:Date.now()},{merge:true});}
window.addEventListener('manabi-profile-change',()=>{if(uid&&nick)saveProfile().catch(()=>status('見た目は端末に保存。オンラインへの保存は未完了。'))});
async function refresh(){const button=$('refreshBoard');button.disabled=true;try{const snap=await getDocs(collection(db,'players'));const records=snap.docs.map(item=>({id:item.id,...item.data()}));window.ManabiLeaderboard.render(records);$('boardStatus').textContent='各ゲームの最高連続正解。同率1位は全員表示。';}catch(e){window.ManabiLeaderboard.render([],{error:true});$('boardStatus').textContent='記録を取得できない。時間をおいて更新する。';}finally{button.disabled=false}}
$("refreshBoard").onclick=refresh;
$("playerForm").onsubmit=async e=>{e.preventDefault();const value=$("nickname").value.trim();if(!validName(value)){alert("ニックネームは1〜12文字で入力する");return;}nick=value;window.manabiStorage.setItem("mgl_nickname",nick);showPlayer();if(uid){try{await saveProfile();status("オンラインに登録しました");await refresh()}catch(e){status("名前はこの端末に保存しました。オンライン登録は未完了です。")}}};
nick=window.manabiStorage.getItem("mgl_nickname")||"";if(!validName(nick))nick="";showPlayer();
onAuthStateChanged(auth,async user=>{if(!user)return;uid=user.uid;try{const ref=doc(db,"players",uid),snapshot=await getDoc(ref);if(snapshot.exists()&&snapshot.data().nickname){nick=String(snapshot.data().nickname).slice(0,12);window.manabiStorage.setItem("mgl_nickname",nick);showPlayer();}else if(nick){await saveProfile();}online=true;status("オンライン接続中");}catch(e){status("オンラインへの接続を確認してください");}await refresh();});
signInAnonymously(auth).catch(()=>{if(nick)status("この端末には名前を保存しました。オンライン認証に失敗しました。");refresh()});
window.mglSaveScore=async(points,best)=>{if(!uid||!nick)return;try{const ref=doc(db,"players",uid);await setDoc(ref,{nickname:nick,bestStreak:best,points:points,updatedAt:Date.now()},{merge:true});status("記録をオンラインに保存しました");}catch(e){status("記録のオンライン保存に失敗しました");}};
}</script><script>(()=>{const dialog=document.getElementById('nicknameDialog'),welcome=document.getElementById('playerWelcome');function sync(){const nickname=window.manabiStorage.getItem('mgl_nickname')||'';const registered=nickname.trim().length>0&&nickname.length<=12&&!/[<>\n\r]/.test(nickname);if(registered){if(dialog.open)dialog.close()}else{if(!dialog.open)dialog.showModal();document.getElementById('nickname').focus()}}dialog.addEventListener('cancel',e=>e.preventDefault());new MutationObserver(sync).observe(welcome,{attributes:true,attributeFilter:['hidden']});window.addEventListener('pageshow',sync);sync()})();</script></body></html>
