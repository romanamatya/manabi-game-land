<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マナビクエスト</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#253b50;font-family:system-ui,'Yu Gothic',sans-serif}main{max-width:1050px;margin:auto;padding:95px 30px 30px}h1{font-size:27px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:25px 20px;background:white;border:1px solid #d9e6f2;border-radius:18px;color:inherit;text-decoration:none}.card strong{display:block;font-size:22px;margin:10px 0}.card small{color:#546e86}.tag{font-size:14px;color:#536e89}.record{font-weight:700;line-height:1.8}.board{background:white;border-radius:15px;margin-top:22px;padding:18px}.board h2{font-size:19px}.board p{margin:8px 0}.note{font-size:13px;color:#5a7087}
.mqlink{position:fixed!important;inset:8px 12px auto auto!important;width:205px;height:58px;padding:0!important;background:transparent!important;box-shadow:none!important;z-index:1000;display:flex!important}.mqlink img{width:100%;height:100%;object-fit:contain}.mqheader,main>nav{height:0!important;margin:0!important;padding:0!important}header:not(.hero){min-height:60px;padding-right:225px!important}.wrap>h1{margin-top:-9px}body>main>h1{padding-top:36px}.overlay{position:fixed!important;inset:50% auto auto 50%!important;transform:translate(-50%,-50%);width:min(600px,70vw);min-height:170px;z-index:200;pointer-events:none}.mapbox path{vector-effect:non-scaling-stroke;stroke-width:.65}.mapbox .tools{z-index:2}.map-source{font-size:10px;margin:3px 0;line-height:1.3}.titles ul{flex:1;align-content:space-around}.feedback{padding:8px;font-size:14px}.feedback h2{font-size:18px}.feedback p{font-size:13px;margin:7px 0}.question{min-height:28px}.mapbox:focus-visible{outline:3px solid #426bd9}button:focus-visible{outline:3px solid #e7ab31;outline-offset:2px}@media(min-width:700px) and (orientation:landscape){body:has(main>.hero) main{padding-top:65px;grid-template-rows:36px minmax(0,1fr) auto}main>.hero{padding:0;text-align:center}main>nav{display:contents!important}main>a:not(.mqlink){top:27px}main:has(>.hero) .actions{min-height:52px}main:has(>.hero) .hero small{display:none}.mapcol{min-width:0}.layout{grid-template-columns:minmax(115px,16%) minmax(0,1.6fr) minmax(155px,.85fr) minmax(115px,16%)}}
</style><style>
.player-panel{max-width:850px;margin:15px auto 0;padding:15px;background:#ffffffed;border:2px solid #d6e8f5;border-radius:18px;color:#28445f}
.player-panel input{font:inherit;padding:12px;border:2px solid #b7cde0;border-radius:10px;max-width:100%;width:260px}
.player-panel button,.board-link{font:inherit;background:#416bdc;color:white;border:0;border-radius:10px;padding:11px 17px;cursor:pointer}
.player-panel .notice{font-size:14px;color:#9c4934;background:#fff0e9;padding:10px;border-radius:9px;margin:9px 0}
.player-panel .status{font-size:13px;color:#4a6179;margin-top:8px}
.leaderboard{max-width:850px;margin:18px auto;background:white;border-radius:20px;padding:20px;box-shadow:0 4px 16px #0001}
.leaderboard h2{margin-top:0}.leaderboard ol{padding-left:30px}.leaderboard li{padding:8px;border-bottom:1px solid #e9eef5}
.leaderboard .mine{background:#eaf5ff;border-radius:8px;font-weight:700}
</style><style>body>.mqlink{position:relative!important;inset:auto!important;width:min(560px,86vw)!important;height:auto!important;aspect-ratio:3/1;margin:12px auto 0!important}body>.mqlink img{display:block}body>main{padding-top:0}body>main>h1{padding-top:0;margin-top:0}</style><body><a class="mqlink" href="index.html" aria-label="トップへ戻る"><img src="assets/title.png" alt="マナビクエスト"></a><main><h1>ゲーム選択</h1><section class="player-panel" id="playerPanel"><div id="playerWelcome"><strong>🌟 プレイヤー登録</strong><p>ニックネームを決めて、みんなのランキングに参加する。</p><form id="playerForm"><label for="nickname">ニックネーム</label><br><input id="nickname" maxlength="12" autocomplete="off" placeholder="例：みかん、ペンギン" required><button type="submit">この名前ではじめる</button></form><p class="notice">⚠️ 本当の名前は使わない。 自分や友達の本名、学校名など、だれなのか分かる名前は入力しない。</p></div><div id="playerReady" hidden><strong id="playerName"></strong><div class="status" id="syncStatus">オンラインに接続しています…</div></div></section><div class="grid"><a class="card" href="games/keisan.html"><small>算数</small><strong>計算のきまり</strong><p>記号を押して、順番に計算。</p><div class="record" data-game="keisan"></div></a><a class="card" href="games/pref-name.html"><small>社会</small><strong>都道府県 名前を当てる</strong><p>色のついた都道府県を4択から選ぶ。</p><div class="record" data-game="pref-name"></div></a><a class="card" href="games/pref-place.html"><small>社会</small><strong>都道府県 場所を当てる</strong><p>地図で場所を選び、「答える」を押す。</p><div class="record" data-game="pref-place"></div></a></div><section class="leaderboard" id="leaderboard"><h2>🏆 みんなのランキング</h2><p>計算のきまり・最高連続正解ランキング</p><ol id="boardList"><li>読み込み中…</li></ol><p id="boardStatus" style="font-size:13px;color:#526980">記録はオンラインで共有されます。ランキングはページを開いたときに更新されます。</p><button type="button" id="refreshBoard" class="board-link">ランキングを更新 ↻</button></section></main><script>
const records=[];document.querySelectorAll('[data-game]').forEach(el=>{const g=el.dataset.game;let v={};try{v=g==='keisan'?{points:Number(localStorage.getItem('mgl_points'))||0,best:Number(localStorage.getItem('mgl_best'))||0}:JSON.parse(localStorage.getItem('mgl_'+g)||'{}')}catch{}el.textContent='ポイント '+(v.points||0)+' ／ 最高 '+(v.best||0)+'問連続';records.push({name:el.closest('a').querySelector('strong').textContent,best:v.best||0})});document.getElementById('records').replaceChildren(...records.map(r=>{const p=document.createElement('p');p.textContent=r.name+'：'+r.best+'問連続';return p}));</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,orderBy,limit,getDocs} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAhm6WMqV7yGmNRRDCeZcOk5HH-dlga9no",authDomain:"manabi-game-land.firebaseapp.com",projectId:"manabi-game-land",storageBucket:"manabi-game-land.firebasestorage.app",messagingSenderId:"723974836914",appId:"1:723974836914:web:4e57af8336083f82a72fab"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let uid=null,nick="",online=false;
const validName=s=>s.length>=1&&s.length<=12&&!/[<>\n\r]/.test(s);
function showPlayer(){ $("playerWelcome").hidden=!!nick;$("playerReady").hidden=!nick;$("playerName").textContent=nick;}
function status(s){$("syncStatus").textContent=s;}
async function saveProfile(){if(!uid||!nick)return;await setDoc(doc(db,"players",uid),{nickname:nick,updatedAt:Date.now()},{merge:true});}
async function refresh(){const list=$("boardList");list.replaceChildren();try{const snap=await getDocs(query(collection(db,"players"),orderBy("bestStreak","desc"),limit(30)));if(snap.empty){const li=document.createElement("li");li.textContent="まだ記録がありません";list.append(li);}snap.forEach((item,i)=>{const d=item.data(),li=document.createElement("li");li.textContent=(i+1)+"位　"+String(d.nickname||"プレイヤー").slice(0,12)+"　🔥 "+(Number(d.bestStreak)||0)+"問";if(item.id===uid)li.className="mine";list.append(li)});$("boardStatus").textContent="最高連続正解で順位を決定。最大30人を表示。";}catch(e){const li=document.createElement("li");li.textContent="ランキングを取得できません";list.append(li);$("boardStatus").textContent="Firebaseのルール設定または通信状態を確認してください。";}}
$("refreshBoard").onclick=refresh;
$("playerForm").onsubmit=async e=>{e.preventDefault();const value=$("nickname").value.trim();if(!validName(value)){alert("ニックネームは1〜12文字で入力する");return;}nick=value;localStorage.setItem("mgl_nickname",nick);showPlayer();if(uid){try{await saveProfile();status("オンラインに登録しました");await refresh()}catch(e){status("名前はこの端末に保存しました。オンライン登録は未完了です。")}}};
nick=localStorage.getItem("mgl_nickname")||"";if(!validName(nick))nick="";showPlayer();
onAuthStateChanged(auth,async user=>{if(!user)return;uid=user.uid;try{const ref=doc(db,"players",uid),snapshot=await getDoc(ref);if(snapshot.exists()&&snapshot.data().nickname){nick=String(snapshot.data().nickname).slice(0,12);localStorage.setItem("mgl_nickname",nick);showPlayer();}else if(nick){await saveProfile();}online=true;status("オンライン接続中");}catch(e){status("オンラインへの接続を確認してください");}await refresh();});
signInAnonymously(auth).catch(()=>{if(nick)status("この端末には名前を保存しました。オンライン認証に失敗しました。");refresh()});
window.mglSaveScore=async(points,best)=>{if(!uid||!nick)return;try{const ref=doc(db,"players",uid);await setDoc(ref,{nickname:nick,bestStreak:best,points:points,updatedAt:Date.now()},{merge:true});status("記録をオンラインに保存しました");}catch(e){status("記録のオンライン保存に失敗しました");}};
</script></body></html>
