name: Heikou Pair browser

on:
  pull_request:
    paths:
      - 'shared-src/site/**/heikou*'
      - 'shared-src/site/math.html'
      - 'tests/heikou*'
      - '.github/workflows/heikou-pair-browser.yml'

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tools/suichoku-smoke-server.mjs > /tmp/heikou-pair-server.log 2>&1 &
      - run: npx playwright test tests/heikou-pair-layout.spec.mjs --browser webkit
