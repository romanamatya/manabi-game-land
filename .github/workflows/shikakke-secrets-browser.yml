name: Quadrilateral Secrets browser

on:
  pull_request:
    paths:
      - 'shared-src/site/**/shikakke*'
      - 'games/shikakkeSecrets.html'
      - 'shikakke-secrets*'
      - 'tests/shikakke*'
      - '.github/workflows/shikakke-secrets-browser.yml'

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tools/suichoku-smoke-server.mjs > /tmp/shikakke-server.log 2>&1 &
      - run: npx playwright test tests/shikakke-secrets-layout.spec.mjs --browser webkit
      - name: Test production paths when configured
        env:
          MGL_SHIKAKKE_PRODUCTION: '1'
        run: |
          if [[ -f games/shikakkeSecrets.html ]]; then
            npx playwright test tests/shikakke-secrets-layout.spec.mjs --browser webkit
          fi
