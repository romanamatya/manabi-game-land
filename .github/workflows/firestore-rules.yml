name: Firestore Rules Emulator

on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'tests/rules/**'
      - 'package.json'
      - 'environment.js'
      - 'environments/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/economy-replay.test.mjs tests/production-ranking-api.test.mjs tests/production-challenge120.test.mjs tests/kotowaza-production.cjs tests/storage-contract.test.mjs
      - run: npm run test:rules:admin-stage2
      - run: npm run test:rules:ranking-admin
      - run: npm run test:rules:ranking-regression

