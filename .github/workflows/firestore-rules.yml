name: Firestore Rules Emulator

on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'tests/rules/**'
      - 'package.json'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:rules:admin-stage2

