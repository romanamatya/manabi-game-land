name: Firestore Rules Emulator

on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'preview/firebase/**'
      - 'management-*.js'
      - 'firebase-store.js'
      - 'spark-auth.js'
      - 'control-room.js'
      - 'shared-src/site/**'
      - 'tests/production-simple-admin.test.mjs'
      - 'tests/rules/**'
      - 'package.json'
      - 'environment.js'
      - 'environments/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --no-package-lock --prefix preview/firebase
      - run: npx firebase emulators:exec --project demo-manabi-preview --only auth,firestore --config firebase.test.json "node --test --test-concurrency=1 tests/*.test.mjs"
        working-directory: preview/firebase

  production-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/economy-replay.test.mjs tests/production-ranking-api.test.mjs tests/production-challenge120.test.mjs tests/kotowaza-production.cjs tests/storage-contract.test.mjs
      - run: npm run test:rules:admin-stage2
      - run: npm run test:simple-admin
      - run: npm run test:rules:simple-admin

