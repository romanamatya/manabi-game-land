name: Parallel release readiness (no deploy)
on:
  pull_request:
    paths:
      - 'shared-src/site/parallel*'
      - 'shared-src/site/assets/parallel-titles/**'
      - 'shared-src/site/games/parallelPair.html'
      - 'challenge120-core.js'
      - 'economy-core.js'
      - 'ranking-sync-api.js'
      - 'environment.js'
      - 'math-navigation.js'
      - 'public-admin-settings.js'
      - 'management-model.js'
      - 'tests/parallel*.test.mjs'
      - 'tests/rules/parallel-stage3.test.mjs'
      - 'firebase/parallel-stage3*'
      - 'tools/prepare-parallel-release.mjs'
      - 'docs/parallel*'
      - '.github/workflows/parallel-release-readiness.yml'
permissions:
  contents: read
jobs:
  parallel-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test tests/parallel*.test.mjs
      - run: node tools/prepare-parallel-release.mjs
      - run: npx firebase emulators:exec --project demo-manabi-parallel-stage3 --only firestore --config firebase/parallel-stage3-emulator.json 'node --test tests/rules/parallel-stage3.test.mjs'
