name: Suichoku browser smoke

on:
  pull_request:
    paths:
      - 'games/suichoku.html'
      - 'suichoku-game.js'
      - 'profile-ui.js'
      - 'math.html'
      - 'math-calculation.html'
      - 'math-geometry.html'
      - 'math-navigation.js'
      - 'suichoku.css'
      - 'assets/suichoku-titles/**'
      - 'tests/suichoku-live.spec.mjs'
      - 'tools/suichoku-smoke-server.mjs'
      - '.github/workflows/suichoku-live-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'games/suichoku.html'
      - 'suichoku-game.js'
      - 'profile-ui.js'
      - 'math.html'
      - 'math-calculation.html'
      - 'math-geometry.html'
      - 'math-navigation.js'
      - 'suichoku.css'
      - 'assets/suichoku-titles/**'
      - 'tests/suichoku-live.spec.mjs'
      - 'tools/suichoku-smoke-server.mjs'
      - '.github/workflows/suichoku-live-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MGL_BASE_URL: ${{ github.event_name == 'push' && 'https://romanamatya.github.io/manabi-game-land/' || 'http://127.0.0.1:4173/' }}
      MGL_EXPECT_LIVE: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve the candidate pages for pull request tests
        if: github.event_name == 'pull_request'
        run: node tools/suichoku-smoke-server.mjs > /tmp/suichoku-smoke.log 2>&1 &
      - run: npx playwright test tests/suichoku-live.spec.mjs
