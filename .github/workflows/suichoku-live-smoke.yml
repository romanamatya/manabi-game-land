name: Suichoku browser smoke

on:
  pull_request:
    paths:
      - 'celebration-effects.js'
      - 'shared-src/site/celebration-effects.js'
      - 'games/**'
      - 'game-home.css'
      - 'parallel.css'
      - 'parallel-game.js'
      - 'tests/game-ui-layout.spec.mjs'
      - 'tests/vertical-parallel-layout.spec.mjs'
      - 'tests/points-storage.spec.mjs'
      - 'storage-adapters.js'
      - 'math-concepts-production-points.js'
      - 'tests/celebration-effects.test.mjs'
      - 'games/suichoku.html'
      - 'suichoku-game.js'
      - 'profile-ui.js'
      - 'math.html'
      - 'math-calculation.html'
      - 'math-geometry.html'
      - 'math-navigation.js'
      - 'math-navigation.css'
      - 'ranking-sync-api.js'
      - 'ranking-sync-client.js'
      - 'ranking-page.js'
      - 'ranking.html'
      - 'economy.js'
      - 'economy-core.js'
      - 'profile-catalog.js'
      - 'environment.js'
      - 'suichoku.css'
      - 'assets/suichoku-titles/**'
      - 'tests/suichoku-live.spec.mjs'
      - 'tests/missing-alphabet-live.spec.mjs'
      - 'tests/production-ranking-api.test.mjs'
      - 'tests/missing-alphabet-integration.test.mjs'
      - 'tests/production-challenge120.test.mjs'
      - 'shared-src/site/challenge120-core.js'
      - 'shared-src/site/challenge120-runtime.js'
      - 'shared-src/site/missing-alphabet-game.js'
      - 'challenge120-core.js'
      - 'challenge120-runtime.js'
      - 'shared-src/site/games/missingAlphabet.html'
      - 'shared-src/site/missing-alphabet-ranking-sync.js'
      - 'shared-src/site/ranking-sync-api.js'
      - 'shared-src/site/ranking-page.js'
      - 'shared-src/site/home-data.js'
      - 'tools/site-environment.mjs'
      - 'environments/production.json'
      - 'preview/games/missingAlphabet.html'
      - 'tools/suichoku-smoke-server.mjs'
      - '.github/workflows/suichoku-live-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'celebration-effects.js'
      - 'shared-src/site/celebration-effects.js'
      - 'games/**'
      - 'game-home.css'
      - 'parallel.css'
      - 'parallel-game.js'
      - 'tests/game-ui-layout.spec.mjs'
      - 'tests/vertical-parallel-layout.spec.mjs'
      - 'tests/points-storage.spec.mjs'
      - 'storage-adapters.js'
      - 'math-concepts-production-points.js'
      - 'tests/celebration-effects.test.mjs'
      - 'games/suichoku.html'
      - 'suichoku-game.js'
      - 'profile-ui.js'
      - 'math.html'
      - 'math-calculation.html'
      - 'math-geometry.html'
      - 'math-navigation.js'
      - 'math-navigation.css'
      - 'ranking-sync-api.js'
      - 'ranking-sync-client.js'
      - 'ranking-page.js'
      - 'ranking.html'
      - 'economy.js'
      - 'economy-core.js'
      - 'profile-catalog.js'
      - 'environment.js'
      - 'suichoku.css'
      - 'assets/suichoku-titles/**'
      - 'tests/suichoku-live.spec.mjs'
      - 'tests/missing-alphabet-live.spec.mjs'
      - 'tests/production-ranking-api.test.mjs'
      - 'tests/missing-alphabet-integration.test.mjs'
      - 'tests/production-challenge120.test.mjs'
      - 'shared-src/site/challenge120-core.js'
      - 'shared-src/site/challenge120-runtime.js'
      - 'shared-src/site/missing-alphabet-game.js'
      - 'challenge120-core.js'
      - 'challenge120-runtime.js'
      - 'shared-src/site/games/missingAlphabet.html'
      - 'shared-src/site/missing-alphabet-ranking-sync.js'
      - 'shared-src/site/ranking-sync-api.js'
      - 'shared-src/site/ranking-page.js'
      - 'shared-src/site/home-data.js'
      - 'tools/site-environment.mjs'
      - 'environments/production.json'
      - 'preview/games/missingAlphabet.html'
      - 'tools/suichoku-smoke-server.mjs'
      - '.github/workflows/suichoku-live-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MGL_BASE_URL: ${{ github.event_name == 'push' && 'https://romanamatya.github.io/manabi-game-land/' || 'http://127.0.0.1:4173/' }}
      MGL_EXPECT_LIVE: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve the candidate pages for pull request tests
        if: github.event_name == 'pull_request'
        run: node tools/suichoku-smoke-server.mjs > /tmp/suichoku-smoke.log 2>&1 &
      - run: npx playwright test tests/suichoku-live.spec.mjs tests/missing-alphabet-live.spec.mjs tests/game-ui-layout.spec.mjs

      - name: Check shared point storage with and without Web Locks
        if: github.event_name == 'pull_request'
        run: npx playwright test tests/points-storage.spec.mjs --browser chromium
      - name: Check point storage in WebKit with a tablet viewport
        if: github.event_name == 'pull_request'
        run: |
          npx playwright install --with-deps webkit
          npx playwright test tests/points-storage.spec.mjs --browser webkit

      - name: Check the line quiz with iPad-sized touch input
        if: github.event_name == 'pull_request'
        run: npx playwright test tests/vertical-parallel-layout.spec.mjs --browser webkit

      - name: Verify the three title towers and award illustrations in WebKit
        if: github.event_name == 'pull_request'
        env:
          MGL_BADGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npx playwright test tests/title-art-layout.spec.mjs --browser webkit
      - name: Upload title illustration comparisons
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: title-illustration-comparisons
          path: badge-display-screenshots/
          if-no-files-found: ignore
