name: Read-only point diagnostic
on:
  pull_request:
    paths:
      - 'support/point-check*'
      - 'tests/point-check*'
      - '.github/workflows/point-check.yml'
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tools/suichoku-smoke-server.mjs > /tmp/point-check-server.log 2>&1 &
      - run: npx playwright test tests/point-check.spec.mjs --browser webkit --workers 1
