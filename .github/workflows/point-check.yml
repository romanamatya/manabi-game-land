name: Read-only point diagnostic
on:
  pull_request:
    paths:
      - 'support/point-check*'
      - 'tests/point-check*'
      - '.github/workflows/point-check.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: node tools/suichoku-smoke-server.mjs > /tmp/point-check-server.log 2>&1 &
      - name: Check diagnostic in the runner's installed Chrome
        run: |
          printf "export default { use: { channel: 'chrome' } };\\n" > point-check.config.mjs
          npx playwright test tests/point-check.spec.mjs --config point-check.config.mjs --workers 1
