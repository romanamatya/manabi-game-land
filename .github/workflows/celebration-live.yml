name: Game celebration browser tests
on:
  pull_request:
    paths:
      - 'celebration-effects.js'
      - 'tests/celebration-live.spec.mjs'
      - '.github/workflows/celebration-live.yml'
permissions:
  contents: read
jobs:
  answers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tools/suichoku-smoke-server.mjs &
      - run: npx playwright test tests/celebration-live.spec.mjs --browser ${{ matrix.browser }}
