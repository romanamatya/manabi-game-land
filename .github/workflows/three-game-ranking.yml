name: Three-game challenge ranking

on:
  pull_request:
    paths:
      - '**/challenge-ranking.js'
      - 'firebase/three-game-*.rules'
      - 'tests/**/three-game*'
      - '.github/workflows/three-game-ranking.yml'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: |
          ./node_modules/.bin/firebase emulators:exec --project demo-manabi-three-game-ranking \
            --only firestore --config firebase/rules-release-emulator.json \
            "node --test tests/rules/three-game-challenge-ranking.test.mjs"
  webkit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tools/suichoku-smoke-server.mjs > /tmp/challenge-ranking-test.log 2>&1 &
      - run: npx playwright test tests/three-game-ranking-layout.spec.mjs --browser webkit
