name: NEW badge browser layout

on:
  pull_request:
    paths:
      - 'index.html'
      - 'math.html'
      - 'math-geometry.html'
      - 'math-navigation.js'
      - 'new-game-badge.css'
      - 'tests/new-game-badges-layout.spec.mjs'
      - '.github/workflows/new-game-badges.yml'

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tools/suichoku-smoke-server.mjs > /tmp/new-game-badges-server.log 2>&1 &
      - run: npx playwright test tests/new-game-badges-layout.spec.mjs --browser webkit
