name: Title collection browser
on:
  pull_request:
    paths:
      - 'shared-src/site/**'
      - 'tools/title-mode.mjs'
      - 'tools/build-site.mjs'
      - 'environments/preview.json'
      - 'tests/title-collection*'
      - '.github/workflows/title-collection-browser.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MGL_CHROME_CHANNEL: ${{ matrix.browser == 'chromium' && 'chrome' || '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Japanese fonts for the installed Chrome
        if: matrix.browser == 'chromium'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - if: matrix.browser == 'webkit'
        run: npx playwright install --with-deps webkit
      - run: node tools/suichoku-smoke-server.mjs > /tmp/title-server.log 2>&1 &
      - run: npx playwright test tests/title-collection-layout.spec.mjs --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-collection-${{ matrix.browser }}
          path: test-results/
