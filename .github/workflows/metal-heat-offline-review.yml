name: Metal heat offline review

on:
  push:
    branches: [infra/metal-heat-offline-review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build offline review
        run: |
          npm run build:preview
          node tools/build-metal-heat-standalone.mjs
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify offline play and local storage
        run: |
          npx playwright test tests/metal-heat-offline.spec.mjs --browser=chromium --reporter=line
          npx playwright test tests/metal-heat-offline.spec.mjs --browser=webkit --reporter=line
      - name: Record build digest
        run: sha256sum .release/manabi-metal-heat-review.html >> "$GITHUB_STEP_SUMMARY"
