name: Firestore Rules release rehearsal

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/firestore-rules-release.yml'
      - 'firebase/*release*.rules'
      - 'preview/firebase/tests/challenge-prototype.rules'
      - 'firebase/rules-release-emulator.json'
      - 'tools/firestore-rules-release*.mjs'
      - 'tests/firestore-rules-release.test.mjs'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      target:
        description: Firebase project scope
        type: choice
        options: [preview, production]
        default: preview
      operation:
        description: Publish or restore requires approval. Rehearse is preview-only.
        type: choice
        options: [inspect, plan, deploy, rollback, rehearse]
        default: inspect
      rollback_ruleset:
        description: Previous immutable Ruleset name from the backup receipt
        type: string

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event.action == 'labeled' && github.event.label.name == 'preview-rules-rehearsal' && 'preview') || github.ref }}
  cancel-in-progress: false

jobs:
  select:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.config.outputs.project }}
      source: ${{ steps.config.outputs.source }}
      baseline: ${{ steps.config.outputs.baseline }}
    steps:
      - id: config
        env:
          TARGET: ${{ inputs.target || 'preview' }}
          OPERATION: ${{ inputs.operation || 'test' }}
          ROLLBACK_RULESET: ${{ inputs.rollback_ruleset }}
          RULES_PRODUCTION_WRITE_ENABLED: ${{ vars.RULES_PRODUCTION_WRITE_ENABLED }}
        run: |
          set -euo pipefail
          case "$TARGET/$OPERATION" in
            production/inspect|production/plan|production/deploy|production/rollback)
              project=manabi-game-land
              baseline=firebase/production-release-baseline.rules
              source=firebase/production-release-candidate.rules
              ;;
            preview/test|preview/rehearse)
              project=manabi-game-landcheck
              baseline=
              source=preview/firebase/tests/challenge-prototype.rules
              ;;
            preview/inspect|preview/plan|preview/deploy|preview/rollback)
              project=manabi-game-landcheck
              baseline=firebase/preview-release-baseline.rules
              source=firebase/preview-release-candidate.rules
              ;;
            *) echo "::error::Unsupported operation for the selected project."; exit 1 ;;
          esac
          if [[ "$TARGET" == production && ( "$OPERATION" == deploy || "$OPERATION" == rollback ) ]]; then
            if [[ "$RULES_PRODUCTION_WRITE_ENABLED" != true ]]; then
              echo "::error::Production writes are disabled."
              exit 1
            fi
          fi
          if [[ "$OPERATION" == rollback ]]; then
            [[ "$ROLLBACK_RULESET" =~ ^projects/${project}/rulesets/[A-Za-z0-9_-]+$ ]]
            temp="$baseline"
            baseline="$source"
            source="$temp"
          fi
          printf 'project=%s\nbaseline=%s\nsource=%s\n' "$project" "$baseline" "$source" >> "$GITHUB_OUTPUT"

  test:
    needs: select
    if: github.event_name == 'pull_request' || (inputs.operation != 'inspect' && inputs.operation != 'rehearse')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/firestore-rules-release.test.mjs
      - name: Run Emulator against the exact proposed source
        env:
          RULES_PROFILE: ${{ inputs.target || 'preview' }}
          RULES_TEST_SOURCE: ${{ needs.select.outputs.source }}
        run: |
          test -s "$RULES_TEST_SOURCE"
          ./node_modules/.bin/firebase emulators:exec --project demo-manabi-rules-release \
            --only firestore --config firebase/rules-release-emulator.json \
            "node --test tools/firestore-rules-release-emulator.mjs"

      - name: Check the published production baseline in Emulator
        if: github.event_name == 'pull_request'
        env:
          RULES_PROFILE: production
          RULES_TEST_SOURCE: firebase/production-release-baseline.rules
        run: |
          ./node_modules/.bin/firebase emulators:exec --project demo-manabi-rules-release \
            --only firestore --config firebase/rules-release-emulator.json \
            "node --test tools/firestore-rules-release-emulator.mjs"

  compare:
    needs: [select, test]
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && needs.select.result == 'success'
          && (needs.test.result == 'success' || ((inputs.operation == 'inspect' || inputs.operation == 'rehearse') && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: firebase-rules-${{ inputs.target }}-read
    permissions:
      contents: read
      id-token: write
    outputs:
      plan: ${{ steps.compare.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.RULES_WIF_PROVIDER }}
          service_account: ${{ vars.RULES_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
      - id: compare
        env:
          RULES_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: ${{ needs.select.outputs.project }}
          BASELINE: ${{ needs.select.outputs.baseline }}
          CANDIDATE: ${{ needs.select.outputs.source }}
          OPERATION: ${{ inputs.operation }}
          RULES_PLANNED_OPERATION: ${{ inputs.operation }}
          ROLLBACK_RULESET: ${{ inputs.rollback_ruleset }}
        run: |
          set -euo pipefail
          mode=plan
          if [[ "$OPERATION" == inspect ]]; then
            mode=inspect
            if [[ "$PROJECT" == manabi-game-landcheck ]]; then BASELINE=; fi
          elif [[ "$OPERATION" == rehearse ]]; then
            mode=rehearse-plan
          fi
          node tools/firestore-rules-release.mjs "$mode" "$PROJECT" "$BASELINE" "$CANDIDATE" > rules-backup.json
          printf 'plan=%s\n' "$(cat rules-backup.json)" >> "$GITHUB_OUTPUT"
          printf 'Commit: `%s`\n\n```json\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat rules-backup.json >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-backup-receipt
          path: rules-backup.json
          if-no-files-found: error

  publish:
    needs: [select, test, compare]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && (inputs.operation == 'deploy' || inputs.operation == 'rollback')
          && (inputs.target == 'preview' || vars.RULES_PRODUCTION_WRITE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.target == 'production' && 'firebase-rules-production-write' || 'firebase-rules-preview' }}
    outputs:
      receipt: ${{ steps.publish.outputs.receipt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the dedicated production publisher
        if: inputs.target == 'production'
        env:
          SERVICE_ACCOUNT: ${{ vars.RULES_SERVICE_ACCOUNT }}
        run: test "$SERVICE_ACCOUNT" = manabi-rules-production-write@manabi-game-land.iam.gserviceaccount.com
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.RULES_WIF_PROVIDER }}
          service_account: ${{ vars.RULES_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
      - id: publish
        env:
          RULES_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RULES_PRODUCTION_WRITE_ENABLED: ${{ vars.RULES_PRODUCTION_WRITE_ENABLED }}
          PROJECT: ${{ needs.select.outputs.project }}
          APPROVED_RULES_PLAN: ${{ needs.compare.outputs.plan }}
          BASELINE: ${{ needs.select.outputs.baseline }}
          CANDIDATE: ${{ needs.select.outputs.source }}
          OPERATION: ${{ inputs.operation }}
          ROLLBACK_RULESET: ${{ inputs.rollback_ruleset }}
        run: |
          set -euo pipefail
          node tools/firestore-rules-release.mjs "$OPERATION" "$PROJECT" "$BASELINE" "$CANDIDATE" > rules-result.json
          printf 'receipt=%s\n' "$(cat rules-result.json)" >> "$GITHUB_OUTPUT"
          printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat rules-result.json >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"


  verify-production:
    needs: publish
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: firebase-rules-production-read
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.RULES_WIF_PROVIDER }}
          service_account: ${{ vars.RULES_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
      - env:
          RULES_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RULES_PUBLICATION_RECEIPT: ${{ needs.publish.outputs.receipt }}
        run: |
          set -euo pipefail
          node tools/firestore-rules-release.mjs verify manabi-game-land | tee -a "$GITHUB_STEP_SUMMARY"

  rehearse-preview:
    needs: compare
    if: >-
      ${{ !cancelled() && needs.compare.result == 'success'
          && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && inputs.target == 'preview' && inputs.operation == 'rehearse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: firebase-rules-preview
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the local Emulator before requesting credentials
        run: ./node_modules/.bin/firebase setup:emulators:firestore
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.RULES_WIF_PROVIDER }}
          service_account: ${{ vars.RULES_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
      - name: Compare, publish a comment-only copy, reject a stale plan, and restore
        env:
          RULES_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          APPROVED_RULES_PLAN: ${{ needs.compare.outputs.plan }}
        run: |
          set -euo pipefail
          node tools/firestore-rules-release.mjs rehearse manabi-game-landcheck | tee -a "$GITHUB_STEP_SUMMARY"
