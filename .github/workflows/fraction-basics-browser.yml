name: Fraction basics browser

on:
  pull_request:
    paths:
      - 'fraction-basics-*'
      - 'games/fractionBasics.html'
      - 'preview/fraction-basics-*'
      - 'preview/games/fractionBasics.html'
      - 'tests/fraction-basics*'
      - 'tests/fraction-transform*'
      - '.github/workflows/fraction-basics-browser.yml'

permissions:
  contents: read

jobs:
  tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      MGL_FRACTION_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        target: [preview, production]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - if: matrix.browser == 'webkit'
        run: npx playwright install --with-deps webkit
      - if: matrix.browser == 'chromium'
        run: npx playwright install --with-deps chromium
      - run: node tools/suichoku-smoke-server.mjs > /tmp/fraction-basics-server.log 2>&1 &
      - run: npx playwright test tests/fraction-basics-browser.spec.mjs --browser ${{ matrix.browser }}
      - run: npx playwright test tests/fraction-transform-browser.spec.mjs --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fraction-basics-${{ matrix.target }}-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
