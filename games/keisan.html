<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>計算のきまりゲーム</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,"Yu Gothic",sans-serif;background:#f1f7ff;color:#23324a;margin:0;padding:16px}main{max-width:760px;margin:auto;background:white;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 8px 30px #1232}a{color:#456}h1{text-align:center;font-size:clamp(25px,5vw,36px);margin-bottom:8px}.intro{text-align:center;margin:8px}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}.stat{background:#eef3ff;padding:10px 20px;border-radius:15px;text-align:center}.stat b{display:block;font-size:27px}.stat small{font-size:13px}.work{overflow-x:auto;padding:8px 0;margin:15px 0}.line{display:grid;grid-template-columns:38px max-content;align-items:center;min-height:62px;justify-content:start;width:max-content;min-width:100%;font-size:clamp(26px,5.5vw,40px)}.eq{text-align:center;color:#64748b}.expression{display:flex;align-items:center;gap:2px;white-space:nowrap}.num{padding:4px 2px}.paren{color:#bc4774;font-weight:700}.op{font:inherit;border:2px solid #a6b4ef;border-radius:12px;background:#e9edff;color:#243a8c;padding:4px 9px;cursor:pointer;touch-action:manipulation}.op:active{transform:scale(.95)}.past{color:#56677d;border-top:1px solid #e9edf5}.past .expression{padding:4px 0}#msg{min-height:60px;display:flex;justify-content:center;align-items:center;text-align:center;font-size:clamp(19px,4vw,24px);font-weight:750;border-radius:14px;padding:12px;margin:14px 0;background:#eef3ff;color:#2d467c}#msg.correct{background:#ddf8e9;color:#17663b}#msg.wrong{background:#ffe4e4;color:#a32030}#msg.complete{background:#fff1bc;color:#815000}button.next{display:block;margin:20px auto;background:#4b65e9;color:white;border:0;border-radius:14px;padding:14px 25px;font-size:20px;cursor:pointer}button.next[hidden]{display:none}.hint{text-align:center;color:#65718b;font-size:14px}
</style></head><body><main><a href="../index.html">← ゲームランドにもどる</a><h1>🧮 計算のきまり</h1><p class="intro">先に計算する記号をタップしよう！</p><p class="hint">（ ）の中 → ×・÷ → ＋・－ の順番</p><div class="stats"><div class="stat"><small>クリアした問題</small><b id="score">0</b></div><div class="stat"><small>連続正解</small><b id="streak">0</b></div><div class="stat"><small>最高連続正解</small><b id="best">0</b></div></div><div class="work" id="work"></div><div id="msg" role="status" aria-live="polite">どこから計算する？</div><button class="next" id="next" hidden>つぎの問題 ▶</button></main>
<script>
let nums=[],ops=[],group=-1,score=0,streak=0,best=0,history=[],finished=false;
const signs=['＋','－','×','÷'],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function calc(a,b,op){return op===0?a+b:op===1?a-b:op===2?a*b:a/b}
function nextIndex(os,g){if(g>=0)return g;const rank=Math.max(...os.map(x=>x>=2?1:0));return os.findIndex(x=>(x>=2?1:0)===rank)}
function valid(ns,os,g){ns=[...ns];os=[...os];while(os.length){const i=nextIndex(os,g),v=calc(ns[i],ns[i+1],os[i]);if(!Number.isInteger(v)||v<0||v>999)return false;ns.splice(i,2,v);os.splice(i,1);g=-1}return true}
function pieces(ns,os,g){let s=[];ns.forEach((n,i)=>{if(g===i)s.push(['paren','（']);s.push(['num',String(n)]);if(g===i-1)s.push(['paren','）']);if(i<os.length)s.push(['op',signs[os[i]],i])});return s}
function row(ns,os,g,isPast,isFirst){const line=document.createElement('div');line.className='line'+(isPast?' past':'');const eq=document.createElement('span');eq.className='eq';eq.textContent=isFirst?'':'＝';line.append(eq);const exp=document.createElement('div');exp.className='expression';pieces(ns,os,g).forEach(([kind,val,i])=>{const el=document.createElement(kind==='op'&&!isPast?'button':'span');el.className=kind;el.textContent=val;if(kind==='op'&&!isPast){el.type='button';el.setAttribute('aria-label',val+' を計算');el.onclick=()=>choose(i)}exp.append(el)});line.append(exp);return line}
function render(){const work=document.getElementById('work');work.replaceChildren();history.forEach((h,i)=>work.append(row(h.n,h.o,h.g,i>0,i===0)));if(history.length>0)work.append(row(nums,ops,group,true,false));document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;document.getElementById('best').textContent=best}
function message(text,kind=''){const el=document.getElementById('msg');el.className=kind;el.textContent=text}
function newGame(){let attempts=0;do{nums=Array.from({length:4},()=>rand(1,12));ops=Array.from({length:3},()=>rand(0,3));group=Math.random()<.7?rand(0,2):-1;attempts++}while(!valid(nums,ops,group)&&attempts<20000);history=[];finished=false;history.push({n:[...nums],o:[...ops],g:group});document.getElementById('next').hidden=true;message('どこから計算する？');render()}
function choose(i){if(finished)return;if(i!==nextIndex(ops,group)){streak=0;message('❌ ざんねん！ 順番がちがうよ。もう一度！','wrong');render();return}streak++;best=Math.max(best,streak);const v=calc(nums[i],nums[i+1],ops[i]);nums.splice(i,2,v);ops.splice(i,1);group=-1;if(ops.length){message('⭕ 正解！ その調子！','correct')}else{score++;finished=true;message('🎉 大正解！ 1問クリア！','complete');document.getElementById('next').hidden=false}history.push({n:[...nums],o:[...ops],g:group});render()}
document.getElementById('next').onclick=newGame;newGame();
</script></body></html>
