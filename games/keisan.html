<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>計算のきまり｜まなびゲームランド</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f0f7fd;color:#203c57;font-family:system-ui,"Yu Gothic",sans-serif}main{max-width:760px;margin:auto;background:white;border-radius:24px;padding:clamp(16px,4vw,30px);box-shadow:0 8px 28px #20486b16}a{color:#426b91}.hero{background:#e8f4ff;border-radius:18px;padding:18px;margin:14px 0}.hero h1{margin:4px 0;font-size:clamp(25px,5vw,36px)}.hero p{margin:4px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{border-radius:14px;text-align:center;padding:13px 4px}.stat:nth-child(1){background:#fff2d6}.stat:nth-child(2){background:#e8f4ff}.stat:nth-child(3){background:#e9f8ed}.stat small{display:block;font-size:clamp(11px,2.5vw,15px);font-weight:700}.stat b{font-size:clamp(26px,5vw,36px)}.rank,.work,.guide{border:1px solid #dfeaf3;border-radius:17px;padding:16px;margin:14px 0}.rank strong{font-size:20px}.progress{height:10px;background:#edf1f5;border-radius:12px;overflow:hidden;margin:12px 0 6px}.bar{height:100%;background:#e9ac41;width:0;transition:width .3s}.muted{color:#54718b;font-size:14px}.work{overflow-x:auto}.work-title{font-weight:700;color:#59748c;margin-bottom:12px}.line{display:grid;grid-template-columns:36px max-content;align-items:center;min-height:61px;width:max-content;min-width:100%;font-size:clamp(25px,5.5vw,39px)}.eq{color:#54718b;text-align:center}.expression{display:flex;align-items:center;gap:2px;white-space:nowrap}.paren,.num{color:#203c57}.op{font:inherit;border:2px solid #a8bdeb;border-radius:11px;background:#eef3ff;color:#23467c;padding:3px 8px;cursor:pointer;touch-action:manipulation}.op:active{transform:scale(.95)}.previous{border-bottom:1px solid #edf2f7}.previous .expression{opacity:.78}#msg{border-radius:14px;background:#eaf5ff;color:#24577d;padding:18px;text-align:center;font-weight:800;font-size:clamp(19px,3.8vw,24px);min-height:68px}#msg.correct{background:#e0f7e9;color:#17683c}#msg.wrong{background:#fff0e8;color:#9a4932}#msg.win{background:#fff1c7;color:#80520a}.guide{background:#f0f7fd}.guide h2{text-align:center;font-size:23px;margin:0 0 12px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.step{background:white;border-radius:12px;text-align:center;padding:12px 5px;font-weight:700;font-size:clamp(15px,3vw,19px)}.step b{display:block;color:#24649b;font-size:28px}.guide p{text-align:center;font-weight:700;margin-bottom:0}.actions{display:grid;gap:10px;margin-top:16px}.action{border:0;border-radius:13px;background:#466be2;color:white;font-size:20px;font-weight:700;padding:14px;cursor:pointer}.action.secondary{background:white;color:#315b8d;border:2px solid #9bb9e0}.action[hidden]{display:none}button:focus-visible{outline:3px solid #eead43;outline-offset:3px}
</style></head><body><main>
<a href="../index.html">← ゲームランドにもどる</a>
<header class="hero"><small>まなびゲームランド</small><h1>🧮 計算のきまり</h1><p>計算する記号をタップして、ポイントを集めよう！</p></header>
<div class="stats"><div class="stat"><small>⭐ ポイント</small><b id="points">0</b></div><div class="stat"><small>🔥 連続正解</small><b id="streak">0</b></div><div class="stat"><small>🏆 最高記録</small><b id="best">0</b></div></div>
<section class="rank"><div class="muted">いまの称号</div><strong id="rank">🌱 計算チャレンジャー</strong><div class="progress"><div class="bar" id="bar"></div></div><div class="muted" id="rankNext"></div></section>
<section class="work" id="work" aria-label="計算の途中式"></section>
<div id="msg" role="status" aria-live="polite">どの記号から計算する？</div>
<section class="guide"><h2>💡 計算する順番</h2><div class="steps"><div class="step"><b>①</b>（ ）の中</div><div class="step"><b>②</b>×・÷</div><div class="step"><b>③</b>＋・－</div></div><p>同じ順番なら、左から計算しよう！</p></section>
<div class="actions"><button class="action" id="next" hidden>次の問題 ▶</button><button class="action secondary" id="retry" hidden>↻ 間違えた問題に再チャレンジ</button></div>
</main><script>
const signs=['＋','－','×','÷'],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const titles=[{at:0,name:'計算チャレンジャー',icon:'🌱'},{at:5,name:'計算ルーキー',icon:'⭐'},{at:10,name:'計算名人',icon:'🏅'},{at:20,name:'計算博士',icon:'🏆'},{at:40,name:'計算マスター',icon:'👑'}];
let current,original,history=[],points=0,streak=0,best=0,mistake=false,finished=false,retryMode=false,missed=[],awarded=new Set(),questionId=0,activeId=0;
const clone=s=>({n:[...s.n],o:[...s.o],l:s.l,r:s.r});
function calc(a,b,o){return o===0?a+b:o===1?a-b:o===2?a*b:a/b}
function priority(s){const ids=s.o.map((_,i)=>i).filter(i=>s.l<0||(i>=s.l&&i<s.r));return ids.find(i=>s.o[i]>=2)??ids[0]??-1}
function reduce(s,i){const n=[...s.n],o=[...s.o];n.splice(i,2,calc(n[i],n[i+1],o[i]));o.splice(i,1);let l=s.l,r=s.r;if(l>=0){if(i>=l&&i<r){r--;if(l===r){l=-1;r=-1}}else if(i<l){l--;r--}}return {n,o,l,r}}
function valid(s){let x=clone(s);while(x.o.length){const i=priority(x);if(i<0)return false;const v=calc(x.n[i],x.n[i+1],x.o[i]);if(!Number.isInteger(v)||v<0||v>999)return false;x=reduce(x,i)}return true}
function generate(){for(let k=0;k<20000;k++){const n=Array.from({length:4},()=>rand(1,12)),o=Array.from({length:3},()=>rand(0,3)),size=Math.random()<.75?rand(2,3):0,l=size?rand(0,4-size):-1,s={n,o,l,r:size?l+size-1:-1};if(valid(s))return s}return {n:[5,2,1,2],o:[1,3,2],l:1,r:3}}
function parts(s){const out=[];s.n.forEach((n,i)=>{if(i===s.l)out.push(['paren','（']);out.push(['num',String(n)]);if(i===s.r)out.push(['paren','）']);if(i<s.o.length)out.push(['op',signs[s.o[i]],i])});return out}
function row(s,index,interactive){const line=document.createElement('div');line.className='line'+(interactive?'':' previous');const eq=document.createElement('span');eq.className='eq';eq.textContent=index?'＝':'';line.append(eq);const exp=document.createElement('div');exp.className='expression';for(const [kind,val,i] of parts(s)){const el=document.createElement(kind==='op'&&interactive?'button':'span');el.className=kind;el.textContent=val;if(kind==='op'&&interactive){el.type='button';el.setAttribute('aria-label',val+' を計算');el.onclick=()=>choose(i)}exp.append(el)}line.append(exp);return line}
function message(t,kind=''){const m=document.getElementById('msg');m.className=kind;m.textContent=t}
function render(){const w=document.getElementById('work');w.replaceChildren();const heading=document.createElement('div');heading.className='work-title';heading.textContent='計算の途中式';w.append(heading);history.forEach((s,i)=>w.append(row(s,i,false)));w.append(row(current,history.length,!finished));document.getElementById('points').textContent=points;document.getElementById('streak').textContent=streak;document.getElementById('best').textContent=best;const title=titles.filter(t=>points>=t.at).at(-1),next=titles.find(t=>t.at>points);document.getElementById('rank').textContent=title.icon+' '+title.name;document.getElementById('rankNext').textContent=next?'あと '+(next.at-points)+' ポイントで '+next.name+'！':'すべての称号をゲット！';document.getElementById('bar').style.width=(next?(points-title.at)/(next.at-title.at)*100:100)+'%';document.getElementById('next').hidden=!finished;document.getElementById('retry').hidden=!finished||!missed.length;document.getElementById('retry').textContent='↻ 間違えた問題に再チャレンジ（'+missed.length+'問）'}
function hint(s){return s.l>=0?'まずは（ ）の中から考えよう！':s.o.some(x=>x>=2)?'× と ÷ を先に計算しよう！':'＋ と － は左から順番に計算しよう！'}
function choose(i){if(finished)return;if(i!==priority(current)){mistake=true;streak=0;message('おしい！ もう一回がんばろう！ '+hint(current),'wrong');render();return}history.push(clone(current));current=reduce(current,i);if(!current.o.length){finished=true;const win=!mistake&&!awarded.has(activeId);if(win){points++;streak++;best=Math.max(best,streak);awarded.add(activeId)}if(mistake){if(!missed.some(x=>x.id===activeId))missed.push({id:activeId,s:clone(original)});message('最後までがんばったね！ 次もチャレンジ！','wrong')}else{missed=missed.filter(x=>x.id!==activeId);const bonus=[3,5,10,15,20].includes(streak)?' 🎊 '+streak+'問連続正解！ すごい！':'';message(win?'🎉 1ポイント獲得！'+bonus:'最後までよくできたね！','win')}}else message('◎ いいね！ 次の計算に進もう！','correct');render()}
function start(s,id,retry){current=clone(s);original=clone(s);activeId=id;history=[];mistake=false;finished=false;retryMode=retry;message(retry?'もう一度チャレンジ！ 最初から解いてみよう。':'どの記号から計算する？');render()}
function newGame(){const s=generate();start(s,++questionId,false)}
document.getElementById('next').onclick=newGame;
document.getElementById('retry').onclick=()=>{if(!finished||!missed.length)return;const entry=missed.shift();start(entry.s,entry.id,true)};
newGame();
</script></body></html>
