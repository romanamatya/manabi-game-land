<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>計算のきまりゲーム</title><style>body{font-family:system-ui,sans-serif;text-align:center;background:#f1f7ff;color:#23324a;margin:0;padding:20px}main{max-width:720px;margin:auto;background:white;border-radius:25px;padding:24px;box-shadow:0 8px 30px #1232}a{color:#456}h1{font-size:clamp(26px,5vw,38px)}#expr{font-size:clamp(27px,6vw,45px);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:3px;margin:30px 0}.num{padding:8px 2px}.paren{color:#c04b6e;font-weight:bold}.op{font-size:inherit;border:2px solid #a6b4ef;border-radius:14px;background:#e9edff;color:#243a8c;padding:8px 10px;cursor:pointer}.op:active{transform:scale(.94)}#history{white-space:pre-line;line-height:2;font-size:23px;background:#f7f9fc;border-radius:12px;padding:10px}button.next{background:#4b65e9;color:white;border:0;border-radius:14px;padding:14px 25px;font-size:20px;cursor:pointer}#msg{font-size:21px;min-height:32px}</style></head><body><main><a href="../index.html">← ゲームランドにもどる</a><h1>🧮 計算のきまり</h1><p>先に計算する記号をタップしよう！</p><p>ヒント：（ ）の中 → ×・÷ → ＋・－ の順番</p><p>クリア：<b id="score">0</b> 問</p><div id="expr"></div><div id="msg" aria-live="polite"></div><div id="history"></div><p><button class="next" id="next" hidden>つぎの問題 ▶</button></p></main><script>
let nums=[],ops=[],group=-1,score=0,lines=[];const signs=['＋','－','×','÷'];const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function expression(){return nums.map((n,i)=>(group===i?'（':'')+n+(group===i-1?'）':'')+(i<ops.length?signs[ops[i]]:'')).join('')}
function render(){const el=document.getElementById('expr');el.innerHTML='';nums.forEach((n,i)=>{if(group===i){const p=document.createElement('span');p.className='paren';p.textContent='（';el.append(p)}const s=document.createElement('span');s.className='num';s.textContent=n;el.append(s);if(group===i-1){const p=document.createElement('span');p.className='paren';p.textContent='）';el.append(p)}if(i<ops.length){const b=document.createElement('button');b.className='op';b.textContent=signs[ops[i]];b.setAttribute('aria-label',signs[ops[i]]+' を計算');b.onclick=()=>choose(i);el.append(b)}});document.getElementById('history').textContent=lines.join('\n')}
function result(a,b,op){return op===0?a+b:op===1?a-b:op===2?a*b:b===0?NaN:a/b}
function nextIndex(os,g){if(g>=0)return g;const max=Math.max(...os.map(x=>x>=2?1:0));return os.findIndex(x=>(x>=2?1:0)===max)}
function simulate(ns,os,g){ns=[...ns];os=[...os];while(os.length){const i=nextIndex(os,g),v=result(ns[i],ns[i+1],os[i]);if(!Number.isInteger(v)||v<0||v>999)return false;ns.splice(i,2,v);os.splice(i,1);g=-1}return true}
function newGame(){let tries=0;do{nums=Array.from({length:4},()=>rand(1,12));ops=Array.from({length:3},()=>rand(0,3));group=Math.random()<.7?rand(0,2):-1;tries++}while(!simulate(nums,ops,group)&&tries<10000);lines=[];document.getElementById('msg').textContent='どこから計算する？';document.getElementById('next').hidden=true;render()}
function choose(i){if(i!==nextIndex(ops,group)){document.getElementById('msg').textContent='もう一度！ 計算の順番を考えよう';return}const v=result(nums[i],nums[i+1],ops[i]);nums.splice(i,2,v);ops.splice(i,1);group=-1;lines.push('＝ '+expression());document.getElementById('msg').textContent=ops.length?'正解！ 次はどこ？':'🎉 クリア！';if(!ops.length){score++;document.getElementById('score').textContent=score;document.getElementById('next').hidden=false}render()}
document.getElementById('next').onclick=newGame;newGame();
</script></body></html>
