<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>都道府県 場所を当てる｜マナビクエスト</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#253b50;font-family:system-ui,"Yu Gothic",sans-serif}.wrap{max-width:980px;margin:auto;padding:14px}a{color:#315e9c}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(23px,4vw,33px)}.panel{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #142c4410}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#e9f4fc;text-align:center;border-radius:12px;padding:12px}.stat b{display:block;font-size:26px}.bar{height:9px;border-radius:20px;background:#e5ebf0;overflow:hidden}.bar span{display:block;height:100%;background:#57b88b;width:0}button{border:0;border-radius:12px;background:#426bd9;color:white;font-size:18px;font-weight:700;padding:13px;cursor:pointer}button:disabled{opacity:.4}.question{font-size:22px;font-weight:800;text-align:center;margin:12px}.mapbox{position:relative;touch-action:none;user-select:none;overflow:hidden;background:#f8fbff;border-radius:12px}.mapbox svg{display:block;width:100%;height:min(58vh,540px)}.mapbox path{cursor:pointer}.tools{position:absolute;right:10px;top:10px;display:flex;gap:5px}.tools button{padding:8px 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.feedback{background:#e8f8ef;border-radius:14px;padding:12px;margin-top:12px}.feedback h2{margin:0}.feedback p{font-size:17px}#confirm{width:100%;margin:12px 0}#win{text-align:center;background:#fff6d8}#win h1{font-size:38px}#loading{position:absolute;top:45%;width:100%;text-align:center;background:#fffe;padding:10px}[hidden]{display:none!important}</style></head><body><div class="wrap"><header><a href="../social.html">← 社会にもどる</a><strong>マナビクエスト</strong></header><h1>🗾 都道府県 場所を当てる</h1><div class="panel"><div class="stats"><div class="stat">ポイント<b id="points">0</b></div><div class="stat">れんぞく正解<b id="streak">0</b></div><div class="stat">最高きろく<b id="best">0</b></div></div><p id="goal"></p><div class="bar"><span id="bar"></span></div></div><div class="panel" id="play"><div class="question" id="question">地図を読みこみ中…</div><div class="mapbox" id="mapbox"><div id="loading">地図を読みこみ中…</div><svg id="map" viewBox="0 0 700 700"><g id="mapgroup"></g></svg><div class="tools"><button id="zin">＋</button><button id="zout">－</button><button id="zreset">↺</button></div></div><div id="choices" class="choices"></div><button id="confirm" hidden>答える</button><div id="feedback" class="feedback" hidden></div></div><div id="win" class="panel" hidden><h1>🏆 全国制覇！</h1><p>47都道府県、ぜんぶ正解！</p><p>しょうごう「全国制覇」をゲット！</p><button id="continue">つづける ▶</button></div></div><script>const MODE='place';const N=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];const en='Hokkaido Aomori Iwate Miyagi Akita Yamagata Fukushima Ibaraki Tochigi Gunma Saitama Chiba Tokyo Kanagawa Niigata Toyama Ishikawa Fukui Yamanashi Nagano Gifu Shizuoka Aichi Mie Shiga Kyoto Osaka Hyogo Nara Wakayama Tottori Shimane Okayama Hiroshima Yamaguchi Tokushima Kagawa Ehime Kochi Fukuoka Saga Nagasaki Kumamoto Oita Miyazaki Kagoshima Okinawa'.split(' ');const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);const key='mq_pref_'+MODE;let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}state=state||{streak:0,best:0,points:0,queue:[],wins:0};let current='',selected='',phase='ask',timer=null,paths={},pan={x:0,y:0,s:1};const factList={'埼玉県':['深谷ねぎは、深谷市の名物だよ。','長瀞では川下りが楽しめるよ。','秩父夜祭は、歴史のあるお祭りだよ。','渋沢栄一は深谷市で生まれたよ。','川越には昔の町なみが残っているよ。'],'北海道':['札幌では雪まつりが開かれるよ。','じゃがいもの生産がさかんだよ。','知床には豊かな自然があるよ。','旭山動物園は旭川市にあるよ。','函館の夜景は有名だよ。'],'沖縄県':['首里城は那覇市にあるよ。','サンゴしょうが広がる海があるよ。','ゴーヤーを使った料理が有名だよ。','シーサーは沖縄で親しまれているよ。','エイサーという伝統の踊りがあるよ。']};function fact(n){const f=factList[n];return f?f[Math.floor(Math.random()*f.length)]:n+'の自然や文化について調べてみよう。'}function save(){localStorage.setItem(key,JSON.stringify(state))}function stats(){$('streak').textContent=state.streak;$('best').textContent=state.best;$('points').textContent=state.points;$('goal').textContent=state.streak>=47?'全国制覇！':'全国制覇まであと'+(47-state.streak)+'問';$('bar').style.width=Math.min(100,state.streak/47*100)+'%'}function pick(){clearTimeout(timer);if(!state.queue.length)state.queue=shuffle(N);current=state.queue[0];selected='';phase='ask';$('win').hidden=true;$('play').hidden=false;$('feedback').hidden=true;$('confirm').hidden=MODE!=='place';$('confirm').disabled=true;$('question').textContent=MODE==='name'?'色がついている都道府県はどこ？':current+'はどこ？';if(MODE==='name'){const i=N.indexOf(current);const nearby=N.map((n,j)=>({n,d:Math.abs(i-j)})).filter(x=>x.n!==current).sort((a,b)=>a.d-b.d).slice(0,8).map(x=>x.n);const choices=shuffle([current,...shuffle(nearby).slice(0,3)]);$('choices').replaceChildren(...choices.map(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>answer(n);return b}))}save();paint();stats()}function answer(n){if(phase!=='ask')return;phase='feedback';const ok=n===current;state.queue.shift();if(ok){state.streak++;state.points+=10;state.best=Math.max(state.best,state.streak)}else{state.streak=0;state.queue=[]}save();stats();paint(ok,n);$('confirm').hidden=true;$('feedback').hidden=false;$('feedback').innerHTML='';const h=document.createElement('h2');h.textContent=(ok?'正解！ ':'ざんねん！ 正解は ')+current;const p=document.createElement('p');p.textContent='💡 '+fact(current);$('feedback').append(h,p);if(ok&&state.streak===47){$('play').hidden=true;$('win').hidden=false;return}if(ok){const c=document.createElement('p');c.textContent='3秒後に次の問題へ';$('feedback').append(c);timer=setTimeout(pick,3000)}else{const b=document.createElement('button');b.textContent='次へ';b.onclick=pick;$('feedback').append(b)}}function paint(ok,n){Object.entries(paths).forEach(([name,arr])=>arr.forEach(p=>{p.setAttribute('fill',phase==='ask'&&MODE==='name'&&name===current?'#ffba56':phase==='ask'&&name===selected?'#8eb5ff':phase==='feedback'&&name===current?'#56c88c':phase==='feedback'&&name===n?'#f58b8b':'#e4edf4')}))}function transform(){$('mapgroup').setAttribute('transform',`translate(${pan.x} ${pan.y}) translate(350 350) scale(${pan.s}) translate(-350 -350)`)}function zoom(f){pan.s=Math.min(8,Math.max(1,pan.s*f));transform()}$('zin').onclick=()=>zoom(1.4);$('zout').onclick=()=>zoom(1/1.4);$('zreset').onclick=()=>{pan={x:0,y:0,s:1};transform()};$('continue').onclick=pick;const box=$('mapbox'),svg=$('map');let pointers=new Map(),drag=null,gesture=null;function svgPt(x,y){let p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(svg.getScreenCTM().inverse())}function pair(){let [a,b]=[...pointers.values()];return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.hypot(a.x-b.x,a.y-b.y)}}box.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});box.setPointerCapture(e.pointerId);if(pointers.size===1){drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:pan.x,py:pan.y,moved:false};gesture=null}else if(pointers.size===2){gesture={...pair(),s:pan.s,px:pan.x,py:pan.y};drag.moved=true}});box.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2&&gesture){let v=pair(),a=svgPt(gesture.x,gesture.y),b=svgPt(v.x,v.y);pan.s=Math.max(1,Math.min(8,gesture.s*v.d/Math.max(1,gesture.d)));pan.x=gesture.px+(b.x-a.x);pan.y=gesture.py+(b.y-a.y);transform()}else if(pointers.size===1&&drag?.id===e.pointerId){if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8)drag.moved=true;if(drag.moved){let a=svgPt(drag.x,drag.y),b=svgPt(e.clientX,e.clientY);pan.x=drag.px+b.x-a.x;pan.y=drag.py+b.y-a.y;transform()}}});function release(e){if(!pointers.has(e.pointerId))return;const tap=e.type==='pointerup'&&pointers.size===1&&!drag?.moved;if(tap&&MODE==='place'&&phase==='ask'){let el=document.elementFromPoint(e.clientX,e.clientY);const n=el?.getAttribute('data-pref');if(n){selected=n;$('confirm').disabled=false;paint()}}pointers.delete(e.pointerId);if(!pointers.size){drag=null;gesture=null}}['pointerup','pointercancel','lostpointercapture'].forEach(t=>box.addEventListener(t,release));$('confirm').onclick=()=>{if(selected)answer(selected)};box.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15)},{passive:false});function geoName(f){let p=f.properties||{};for(let v of Object.values(p)){if(typeof v!=='string')continue;if(N.includes(v))return v;let i=en.findIndex(n=>n.toLowerCase()===v.toLowerCase());if(i>=0)return N[i]}return null}function render(features){const valid=features.map(f=>({name:geoName(f),g:f.geometry})).filter(x=>x.name&&x.g);if(new Set(valid.map(x=>x.name)).size<40)throw Error('map names');let all=[];for(let f of valid){const polys=f.g.type==='Polygon'?[f.g.coordinates]:f.g.type==='MultiPolygon'?f.g.coordinates:[];for(let poly of polys)for(let ring of poly)for(let pt of ring)all.push(pt)}let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;for(const p of all){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);}const sx=640/(maxx-minx),sy=640/(maxy-miny),scale=Math.min(sx,sy),ox=(700-(maxx-minx)*scale)/2,oy=(700-(maxy-miny)*scale)/2;let group=$('mapgroup');group.replaceChildren();paths={};for(let f of valid){const polys=f.g.type==='Polygon'?[f.g.coordinates]:f.g.type==='MultiPolygon'?f.g.coordinates:[];for(let poly of polys){let d=poly.map(r=>r.map((p,i)=>(i?'L':'M')+(ox+(p[0]-minx)*scale).toFixed(2)+','+(oy+(maxy-p[1])*scale).toFixed(2)).join(' ')+'Z').join(' ');const el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('d',d);el.setAttribute('data-pref',f.name);el.setAttribute('fill','#e4edf4');el.setAttribute('stroke','#8294a8');el.setAttribute('stroke-width','.65');group.append(el);(paths[f.name]??=[]).push(el)}}$('loading').hidden=true;pick()}async function load(){for(let url of ['https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson','https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.geojson']){try{let r=await fetch(url);if(!r.ok)continue;render((await r.json()).features);return}catch(e){console.warn(e)}}$('loading').textContent='地図を読みこめませんでした。ネットの接続を確認してね。'}load();</script></body></html>
