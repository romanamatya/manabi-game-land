<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://www.gstatic.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<title>分数へんしんチャレンジ！【数字入力】｜マナビクエスト</title>
<script src="../environment.js?v=fraction-input-release-v1"></script>
<script src="../environment-runtime.js?v=fraction-basics-v1"></script>
<script src="../profile-catalog.js?v=fraction-input-release-v1"></script>
<script src="../public-firebase-session.js?v=shared-firebase-session-v1"></script>
<script src="../public-game-availability.js?v=firebase-session-recovery-v1"></script>
<script src="../public-admin-settings.js?v=firebase-session-recovery-v1"></script><script src="../fraction-input-production-settings.js?v=fraction-input-release-v1"></script>
<script src="../economy-core.js?v=fraction-input-release-v1"></script>
<script src="../storage-adapters.js?v=fraction-basics-v1"></script>
<script src="../economy.js?v=fraction-basics-v1"></script>
<script src="../challenge120-core.js?v=fraction-input-release-v1"></script>
<script src="../celebration-effects.js"></script>
<script type="module" src="../fraction-transform-input-game.js?v=fraction-input-release-v1"></script>
<link rel="stylesheet" href="../fraction-transform-input.css?v=fraction-single-digit-v1">
</head>
<body data-score-game="fractionTransformInput">
<div class="app">
  <header class="header">
    <a href="../math-fractions.html" class="back">← 算数へ</a>
    <h1>分数へんしんチャレンジ！【数字入力】</h1>

  </header>
  <div class="layout">
    <aside class="panel stats" aria-label="練習記録">
      <h2>練習の記録</h2>
      <div class="stat"><span>連続正解</span><strong id="streak">0</strong></div>
      <div class="stat"><span>自己最高</span><strong id="best">0</strong></div>
      <div class="stat"><span>算数ポイント</span><strong id="points">0</strong></div>
      <div class="timer" id="clock" role="timer">時間制限なし</div>
      <button class="secondary" id="restart" type="button">練習をやり直す</button>
      <div id="input-analysis" class="analysis">
        <h2>学習分析</h2>
        <p data-analysis="fromImproper"></p>
        <p data-analysis="toImproper"></p>
      </div>
    </aside>
    <main class="panel game">
      <div class="question-header"><span class="category" id="category">分数</span><span id="question-number">第1問</span></div>
      <p id="access" role="status">公開状態を確認しています。</p>
      <div class="question-stage">
        <h2 id="question" hidden></h2>
        <div class="diagram" id="diagram" hidden></div>
      </div>
      <p class="instruction" id="instruction" hidden></p>
      <div class="options" id="options" hidden role="group" aria-label="数字で答える"></div>
      <div class="feedback" id="feedback" hidden aria-live="polite"></div>
      <section class="gate" id="gate" hidden>
        <h2 id="gate-title">120秒チャレンジ</h2>
        <p id="gate-message"></p>
        <button id="challenge-start" type="button">120秒チャレンジを始める</button>
        <button id="practice-continue" type="button" class="secondary">時間制限なしの練習にもどる</button>
      </section>
    </main>
    <aside class="panel titles">
      <h2>称号タワー</h2>
      <ol id="titles"></ol>
    </aside>
  </div>
</div>
</body>
</html>
